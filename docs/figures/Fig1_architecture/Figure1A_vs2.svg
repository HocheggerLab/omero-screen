<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 595.28 841.89">
  <!-- Generator: Based on Figure1A_vs1.svg Illustrator style -->
  <defs>
    <style>
      .st0 {
        stroke: #1d1d1b;
      }

      .st0, .st1, .st5 {
        fill: none;
        stroke-miterlimit: 10;
        stroke-width: .5px;
      }

      .st1 {
        stroke: #e6332a;
      }

      .st2 {
        font-size: 6px;
      }

      .st2, .st3 {
        fill: #1d1d1b;
        font-family: ArialMT, Arial;
      }

      .st3 {
        font-size: 7px;
      }

      .st4 {
        fill: #e6332a;
      }

      /* Blue for read arrows */
      .st5 {
        stroke: #2858a6;
      }

      .st6 {
        fill: #2858a6;
      }

      /* Dashed stroke for abstraction layers */
      .st7 {
        fill: none;
        stroke: #1d1d1b;
        stroke-miterlimit: 10;
        stroke-width: .5px;
        stroke-dasharray: 3,2;
      }
    </style>
  </defs>

  <!-- ============================================ -->
  <!-- OMERO SERVER (Top centre - the hub)          -->
  <!-- ============================================ -->
  <g id="omero-server">
    <!-- Main OMERO box -->
    <rect class="st0" x="195" y="60" width="205" height="100" rx="6" ry="6"/>
    <text class="st3" transform="translate(255 75)"><tspan x="0" y="0">OMERO Server</tspan></text>

    <!-- Content labels inside -->
    <text class="st2" transform="translate(210 90)">
      <tspan x="0" y="0">Plates, Wells, Images</tspan>
      <tspan x="0" y="8">Channel Metadata</tspan>
      <tspan x="0" y="16">Segmentation Masks</tspan>
      <tspan x="0" y="24">Analysis Results (CSV)</tspan>
      <tspan x="0" y="32">Flatfield Corrections</tspan>
      <tspan x="0" y="40">Classifier Models</tspan>
    </text>
  </g>

  <!-- ============================================ -->
  <!-- omero-utils (Abstraction layer around OMERO) -->
  <!-- ============================================ -->
  <g id="omero-utils">
    <rect class="st7" x="185" y="48" width="225" height="125" rx="8" ry="8"/>
    <text class="st3" transform="translate(190 58)"><tspan x="0" y="0">omero-utils</tspan></text>
    <text class="st2" transform="translate(250 58)"><tspan x="0" y="0">Connections · Attachments · Annotations</tspan></text>
  </g>

  <!-- ============================================ -->
  <!-- omero-screen (Left - Analysis Pipeline)      -->
  <!-- ============================================ -->
  <g id="omero-screen">
    <!-- Outer box -->
    <rect class="st0" x="20" y="220" width="155" height="260" rx="6" ry="6"/>
    <text class="st3" transform="translate(55 236)"><tspan x="0" y="0">omero-screen</tspan></text>
    <text class="st2" transform="translate(42 246)"><tspan x="0" y="0">Analysis Pipeline</tspan></text>

    <!-- Pipeline step boxes -->
    <rect class="st0" x="30" y="258" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(42 269)"><tspan x="0" y="0">Metadata Parsing</tspan></text>

    <!-- Arrow down -->
    <line class="st0" x1="97.5" y1="274" x2="97.5" y2="280"/>
    <polygon fill="#1d1d1b" points="95.5,279 97.5,282 99.5,279"/>

    <rect class="st0" x="30" y="284" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(42 295)"><tspan x="0" y="0">Flatfield Correction</tspan></text>

    <line class="st0" x1="97.5" y1="300" x2="97.5" y2="306"/>
    <polygon fill="#1d1d1b" points="95.5,305 97.5,308 99.5,305"/>

    <rect class="st0" x="30" y="310" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(42 321)"><tspan x="0" y="0">Cellpose Segmentation</tspan></text>

    <line class="st0" x1="97.5" y1="326" x2="97.5" y2="332"/>
    <polygon fill="#1d1d1b" points="95.5,331 97.5,334 99.5,331"/>

    <rect class="st0" x="30" y="336" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(42 347)"><tspan x="0" y="0">Feature Extraction</tspan></text>

    <line class="st0" x1="97.5" y1="352" x2="97.5" y2="358"/>
    <polygon fill="#1d1d1b" points="95.5,357 97.5,360 99.5,357"/>

    <rect class="st0" x="30" y="362" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(42 373)"><tspan x="0" y="0">Cell Cycle Analysis</tspan></text>

    <line class="st0" x1="97.5" y1="378" x2="97.5" y2="384"/>
    <polygon fill="#1d1d1b" points="95.5,383 97.5,386 99.5,383"/>

    <rect class="st0" x="30" y="388" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(42 399)"><tspan x="0" y="0">Quality Control</tspan></text>

    <!-- Optional classification (dashed) -->
    <line class="st0" x1="97.5" y1="404" x2="97.5" y2="410"/>
    <polygon fill="#1d1d1b" points="95.5,409 97.5,412 99.5,409"/>

    <rect class="st7" x="30" y="414" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(36 425)"><tspan x="0" y="0">Image Classification (opt.)</tspan></text>

    <!-- Loop annotation -->
    <text class="st2" transform="translate(28 456)"><tspan x="0" y="0">Iterates: wells → images</tspan></text>
    <text class="st2" transform="translate(28 464)"><tspan x="0" y="0">Resumable per-well</tspan></text>
  </g>

  <!-- Arrows: omero-screen <-> OMERO -->
  <g id="arrows-pipeline-omero">
