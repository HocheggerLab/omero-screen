    <text class="st2" transform="translate(445 269)"><tspan x="0" y="0">Well Data Viewer</tspan></text>

    <rect class="st0" x="430" y="282" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(455 293)"><tspan x="0" y="0">Cell Gallery</tspan></text>

    <rect class="st0" x="430" y="306" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(432 317)"><tspan x="0" y="0">Training Data Generator</tspan></text>

    <rect class="st0" x="430" y="330" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(438 341)"><tspan x="0" y="0">Classifier Manager</tspan></text>

    <rect class="st0" x="430" y="354" width="135" height="16" rx="3" ry="3"/>
    <text class="st2" transform="translate(440 365)"><tspan x="0" y="0">Session Manager</tspan></text>

    <!-- Local cache (dashed box) -->
    <rect class="st7" x="430" y="384" width="135" height="46" rx="3" ry="3"/>
    <text class="st3" transform="translate(465 397)"><tspan x="0" y="0">Local Cache</tspan></text>
    <text class="st2" transform="translate(438 409)"><tspan x="0" y="0">NPY image crops</tspan></text>
    <text class="st2" transform="translate(438 417)"><tspan x="0" y="0">SQLite annotations DB</tspan></text>
    <text class="st2" transform="translate(438 425)"><tspan x="0" y="0">Session metadata</tspan></text>

    <!-- Plate cache note -->
    <text class="st2" transform="translate(432 454)"><tspan x="0" y="0">Blosc-compressed plate cache</tspan></text>
  </g>

  <!-- Arrows: napari <-> OMERO -->
  <g id="arrows-napari-omero">
    <!-- Read: OMERO -> Napari (blue) -->
    <line class="st5" x1="385" y1="160" x2="465" y2="218"/>
    <polygon class="st6" points="463,216 467,220 461,220"/>
    <text class="st2" transform="translate(408 188)"><tspan x="0" y="0" fill="#2858a6">images</tspan></text>
    <text class="st2" transform="translate(408 196)"><tspan x="0" y="0" fill="#2858a6">masks, data</tspan></text>

    <!-- Write: Napari -> OMERO (red, classifiers) -->
    <line class="st1" x1="440" y1="230" x2="395" y2="170"/>
    <polygon class="st4" points="397,173 392,168 398,168"/>
    <text class="st2" transform="translate(410 208)"><tspan x="0" y="0" fill="#e6332a">classifiers</tspan></text>
  </g>

  <!-- ============================================ -->
  <!-- cellview (Bottom centre)                     -->
  <!-- ============================================ -->
  <g id="cellview">
    <rect class="st0" x="195" y="540" width="205" height="80" rx="6" ry="6"/>
    <text class="st3" transform="translate(270 556)"><tspan x="0" y="0">cellview</tspan></text>
    <text class="st2" transform="translate(235 568)"><tspan x="0" y="0">Local DuckDB Database</tspan></text>

    <text class="st2" transform="translate(210 582)">
      <tspan x="0" y="0">Import from OMERO or CSV</tspan>
      <tspan x="0" y="8">Query &amp; export single-cell data</tspan>
      <tspan x="0" y="16">Project → Experiment → Plate hierarchy</tspan>
    </text>
  </g>

  <!-- Arrow: OMERO -> cellview (blue, one-way import) -->
  <g id="arrows-omero-cellview">
    <line class="st5" x1="297.5" y1="173" x2="297.5" y2="538"/>
    <polygon class="st6" points="295.5,536 297.5,540 299.5,536"/>
    <text class="st2" transform="translate(302 490)"><tspan x="0" y="0" fill="#2858a6">import</tspan></text>
    <text class="st2" transform="translate(302 498)"><tspan x="0" y="0" fill="#2858a6">analysis CSVs</tspan></text>
  </g>

  <!-- ============================================ -->
  <!-- omero-screen-plots (Bottom left)             -->
  <!-- ============================================ -->
  <g id="plots">
    <rect class="st0" x="20" y="540" width="155" height="80" rx="6" ry="6"/>
    <text class="st3" transform="translate(32 556)"><tspan x="0" y="0">omero-screen-plots</tspan></text>
    <text class="st2" transform="translate(40 568)"><tspan x="0" y="0">Publication Figures</tspan></text>

    <text class="st2" transform="translate(30 582)">
      <tspan x="0" y="0">Cell cycle quantification</tspan>
      <tspan x="0" y="8">Feature distribution plots</tspan>
      <tspan x="0" y="16">Statistical analysis</tspan>
      <tspan x="0" y="24">Normalisation</tspan>
    </text>
  </g>

  <!-- Arrow: cellview -> plots (blue) -->
  <g id="arrows-cellview-plots">
    <line class="st5" x1="195" y1="575" x2="180" y2="575"/>
    <polygon class="st6" points="181,573 177,575 181,577"/>
    <text class="st2" transform="translate(180 568)"><tspan x="0" y="0" fill="#2858a6">DataFrames</tspan></text>
  </g>

  <!-- ============================================ -->
  <!-- Output: Publication figures                  -->
  <!-- ============================================ -->
  <g id="output-figures">
    <rect class="st7" x="30" y="640" width="135" height="20" rx="3" ry="3"/>
    <text class="st2" transform="translate(46 654)"><tspan x="0" y="0">Publication Figures</tspan></text>
    <line class="st0" x1="97.5" y1="620" x2="97.5" y2="638"/>
    <polygon fill="#1d1d1b" points="95.5,636 97.5,640 99.5,636"/>
  </g>

  <!-- ============================================ -->
  <!-- LEGEND (Bottom right)                        -->
  <!-- ============================================ -->
  <g id="legend" transform="translate(420, 540)">
    <rect class="st0" x="0" y="0" width="150" height="70" rx="4" ry="4"/>
    <text class="st3" transform="translate(55 14)"><tspan x="0" y="0">Legend</tspan></text>

    <!-- Blue read arrow -->
    <line class="st5" x1="10" y1="28" x2="40" y2="28"/>
    <polygon class="st6" points="38,26 42,28 38,30"/>
    <text class="st2" transform="translate(48 30)"><tspan x="0" y="0">Data read</tspan></text>

    <!-- Red write arrow -->
    <line class="st1" x1="10" y1="42" x2="40" y2="42"/>
    <polygon class="st4" points="38,40 42,42 38,44"/>
    <text class="st2" transform="translate(48 44)"><tspan x="0" y="0">Data write</tspan></text>

    <!-- Dashed = abstraction/optional -->
    <line class="st7" x1="10" y1="56" x2="40" y2="56"/>
    <text class="st2" transform="translate(48 58)"><tspan x="0" y="0">Abstraction / optional</tspan></text>
  </g>

</svg>
