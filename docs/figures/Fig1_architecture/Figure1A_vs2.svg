    <line class="st5" x1="210" y1="160" x2="130" y2="218"/>
    <polygon class="st6" points="132,216 128,220 134,220"/>
    <text class="st2" transform="translate(140 188)"><tspan x="0" y="0" fill="#2858a6">images</tspan></text>
    <text class="st2" transform="translate(140 196)"><tspan x="0" y="0" fill="#2858a6">metadata</tspan></text>

    <!-- Write: Pipeline -> OMERO (red, masks + CSVs) -->
    <line class="st1" x1="155" y1="230" x2="200" y2="170"/>
    <polygon class="st4" points="198,173 203,168 197,168"/>
    <text class="st2" transform="translate(168 200)"><tspan x="0" y="0" fill="#e6332a">masks</tspan></text>
    <text class="st2" transform="translate(168 208)"><tspan x="0" y="0" fill="#e6332a">CSVs, figures</tspan></text>
  </g>

  <!-- ============================================ -->
  <!-- omero-screen-napari (Right side)             -->
