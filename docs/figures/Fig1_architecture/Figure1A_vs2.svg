    <text class="st3" transform="translate(428 236)"><tspan x="0" y="0">omero-screen-napari</tspan></text>
    <text class="st2" transform="translate(440 246)"><tspan x="0" y="0">Interactive Exploration</tspan></text>

    <!-- Sub-components -->
