[project]
name = "omero-screen-napari"
version = "0.8.7"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hh65", email = "hh65@sussex.ac.uk" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    # napari itself belongs here, in the package that imports it — it used to be
    # declared only in the root project, so this package silently relied on the
    # root to supply it. The Qt backend is a separate `qt` extra: it is what has
    # no linux/arm64 wheels, and a headless consumer of this package (the
    # montage CLI, the trainingdata_db tools) does not need it.
    "napari>=0.9.2",
    "cellclass",
    "click>=8.1.8",
    "rich>=13.9.4",
    # <0.14: from 0.14 ome-zarr names pyramid levels s0/s1/s2 instead of
    # 0/1/2 (hard-coded, no option), which our readers assume. 0.12-0.13
    # support zarr 3 and keep the 0/1/2 naming of every existing store. Lift
    # once the readers take level paths from the multiscales metadata.
    "ome-zarr>=0.12,<0.14",
    # zarr 3 API; the cache is still written in zarr v2 / OME-NGFF 0.4
    # layout so BigDataViewer and Mastodon can open it (see writer.py).
    "zarr>=3.1,<4",
    "napari-ome-zarr>=0.10",
    # Lineage tree visualisation for the Tracks layer. Built by the Lowe lab
    # (the team that contributed the napari Tracks layer itself); double-click
    # a track in napari to render its lineage.
    "napari-arboretum>=0.2",
]

[project.optional-dependencies]
# The desktop GUI stack, opt-in. PyQt6: napari deprecated PyQt5 (removal due
# in fall 2026). The PyQt6/Qt6 Linux wheels need glibc >= 2.34 (x86_64) or
# >= 2.39 (aarch64), newer than some clusters and the container's base image,
# so headless installs must not pull it. Named explicitly rather than via
# napari[all] so the binding is a visible choice.
qt = ["napari[pyqt6,optional]>=0.9.2"]

[project.entry-points."napari.manifest"]
omero-screen-napari = "omero_screen_napari:napari.yaml"



[project.scripts]
omero-train = "omero_screen_napari.trainingdata_db.cli:main"
omero-screen-images = "omero_screen_napari.images_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omero_screen_napari"]

# ===========================
# Mypy Configuration Section
# ===========================

[tool.mypy]
strict = true
python_version = 3.12
exclude = [
    "tests/.*",
    ".venv/.*",
    "venv/.*",
    "env/.*",
    "build/.*",
    "dist/.*",
    "migrations/.*",
]

incremental = true
cache_dir = ".mypy_cache"
ignore_missing_imports = false
#follow_imports = "silent"
pretty = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "zarr",
    "zarr.*",
    "ome_zarr",
    "ome_zarr.*",
    "omero",
    "omero.*",
    "dask",
    "dask.*",
]
ignore_missing_imports = true


# ===========================
# Ruff Configuration Section
# ===========================

[tool.ruff]
target-version = "py312"
line-length = 79
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
    "ISC001", # string concatenation conflicts with formatter
    "G004", # logging statement uses f-string
    "BLE001", # Do not catch blind exception
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

fix = true


# ============================
# Pytest Configuration Section
# ============================

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]


# ===========================
# Commitizen Configuration Section
# ===========================


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.7"
tag_format = "omero-screen-napari-v$version"
version_files = [
    "src/omero_screen_napari/__init__.py:__version__",
    "pyproject.toml:version",
    "README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+"
]
version_provider = "commitizen"
major_version_zero = true
bump_message = "bump: version $current_version → $new_version"
update_changelog_on_bump = true
annotated_tag = true

[tool.uv.sources]
cellclass = { workspace = true }
