# Great Docs configuration — cellview.
# Sub-site of the OMERO-Screen platform, deployed to /cellview/.
#
module: cellview
display_name: CellView
parser: google
dynamic: false
pypi: false
repo: https://github.com/HocheggerLab/omero-screen
site_url: https://hocheggerlab.github.io/omero-screen/cellview/

announcement:
  content: "Part of the **OMERO-Screen** platform — [back to the documentation home](https://hocheggerlab.github.io/omero-screen/)"
  type: info
  dismissable: true

hero:
  enabled: true
  tagline: "A DuckDB single-cell database for OMERO-Screen measurements."
  badges: false

cli:
  enabled: true
  module: cellview.cli
  name: cli
  title: "CLI reference"
  desc: >-
    `--db` is a global option and goes before the subcommand, e.g.
    `cellview --db /path/to.duckdb projects`.
  sections:
    - title: "Inspect"
      desc: "Browse what is already in the database."
      contents: [projects, project, experiment, plate]
    - title: "Import and export"
      contents: [import, export]
    - title: "Explore"
      desc: "Interactive notebooks and their templates."
      contents: [explore, template]
    - title: "Maintain"
      desc: "Edit metadata, delete plates, remove orphaned records."
      contents: [edit, delete, clean]

reference:
  - title: Python API
    desc: Loading plate measurements into pandas.
    contents:
      - api.cellview_load_data
