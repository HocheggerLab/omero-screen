[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellview"
version = "0.6.0"
description = "CellView package for single-cell analysis"
authors = [{name = "CellView Team"}]
dependencies = [
    "duckdb",
    "pandas",
    "rich",
    "omero-screen",
    "omero-utils",
]

[tool.uv.sources]
omero-screen = { workspace = true }
omero-utils = { workspace = true }

[project.optional-dependencies]
test = ["pytest", "pytest-mock"]
explore = ["nbformat>=5.9", "jupyterlab>=4.0"]

[tool.setuptools.package-data]
cellview = [
    "explore/templates/*.ipynb",
    "explore/templates/CLAUDE.md",
    "explore/templates/_claude/**/*.md",
]

[project.scripts]
cellview = "cellview.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Add src directory to Python path for tests
pythonpath = ["src"]
