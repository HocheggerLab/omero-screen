[project]
name = "omero-screen-track"
version = "0.9.2"
description = "GUI-free cell-tracking logic for omero-screen: lineage repair, review edits, fates and phases"
readme = "README.md"
authors = [
    { name = "hh65", email = "hh65@sussex.ac.uk" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb",
    "loguru",
    "numpy",
    "pandas",
    "omero-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# ===========================
# Ruff Configuration Section
# ===========================

[tool.ruff]
target-version = "py312"
line-length = 79
lint.select = [
    "D", "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
    "ISC001", # string concatenation conflicts with formatter
    "G004", # logging statement uses f-string
    "D203",  # conflicting with D211 (Google prefers D211)
    "D213",  # conflicting with D212 (Google prefers D212)
    "BLE001", # Do not catch blind exception
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

fix = true

[tool.ruff.lint.pydocstyle]
convention = "google"


# ============================
# Pytest Configuration Section
# ============================

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
