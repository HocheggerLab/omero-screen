# Site profile: Hochegger lab, University of Sussex.
# A site profile holds what everyone at a site shares. Users pick it with
# `omero-screen setup` (site = "sussex"); their own config holds the rest.

[omero]
host = "ome2.hpc.sussex.ac.uk"
port = 4064

# Stitch calibrations per objective, chosen by the plate's pixel size.
# 10x: long-standing lab values, confirmed on plate 3868 (no duplicated objects
# at the seams). 20x: measured on plate 5054 (scripts/diagnose_stitch_seams.py).
[stitching.calibrations.10x]
pixel_size_um = 1.2
overlap_x = 7
overlap_y = 7
translate_x = -3
translate_y = 3

[stitching.calibrations.20x]
pixel_size_um = 0.6
overlap_x = 25
overlap_y = 26
translate_x = -5
translate_y = 4

# Segmentation. With no model set chosen, omero-screen uses the device
# default: Cellpose 4 (cpsam) on an NVIDIA GPU, stock Cellpose 3 elsewhere.
# The lab's custom Cellpose 3 models are opt-in, for reproducing our data:
#   [segmentation]
#   model_set = "hocheggerlab"
# in the user config, after `omero-screen models pull hocheggerlab`.
[segmentation.model_sets.hocheggerlab]
description = "Hochegger lab Cellpose 3 models (Hoechst nuclei, tubulin cells), Operetta 10x/40x"
# Zenodo download URL with {name} for the file name; empty until published.
url = ""

[segmentation.model_sets.hocheggerlab.models]
nuclei = "Nuclei_Hoechst"
RPE = "RPE-1_Tub_Hoechst"
HELA = "HeLa_Tub_Hoechst"
U2OS = "U2OS_Tub_Hoechst"
HCC1143 = "RPE-1_Tub_Hoechst"
MM231 = "MM231_Tub_Hoechst"
PALB = "only_PALB"

