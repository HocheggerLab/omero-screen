services:
  database:
    image: "postgres:14"
    environment:
      POSTGRES_USER: omero
      POSTGRES_DB: omero
      POSTGRES_PASSWORD: omero
    networks:
      - omero
    volumes:
      - "database:/var/lib/postgresql/data"

  omeroserver:
    image: "openmicroscopy/omero-server:5"
    environment:
      CONFIG_omero_db_host: database
      CONFIG_omero_db_user: omero
      CONFIG_omero_db_pass: omero
      CONFIG_omero_db_name: omero
      ROOTPASS: omero
    networks:
      - omero
    ports:
      - "4063:4063"
      - "4064:4064"
    volumes:
      - "omero:/OMERO"
    ulimits:
      nofile:
        soft: 8192
        hard: 65536

  test:
    build: .
    networks:
      - omero
    depends_on:
      - omeroserver

  # Headless pipeline runtime. Behind a profile so `docker compose up` still
  # brings up only the server stack:
  #
  #   docker compose --profile pipeline run --rm pipeline omero-screen --help
  #
  # Credentials come from a .env you supply at the repo root, mounted
  # read-only. Note that omero_screen loads it with override=True, so the FILE
  # WINS over any -e flag or `environment:` entry — to talk to the compose
  # server the file must itself say `HOST=omeroserver`, not localhost.
  pipeline:
    profiles: ["pipeline"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    networks:
      - omero
    depends_on:
      - omeroserver
    volumes:
      - "./.env:/app/.env:ro"
      # Cellpose models. MODEL_DICT names custom lab models that do not exist
      # on cellpose.org, so a run without these fails at model download. The
      # image sets CELLPOSE_LOCAL_MODELS_PATH=/models. A bind mount copies
      # nothing, so pointing at the whole directory is free.
      - "${CELLPOSE_MODELS:-$HOME/.cellpose/models}:/models:ro"
    command: ["omero-screen", "--help"]

  # Same image, CUDA build. Needs a host driver supporting CUDA 12.8 and the
  # NVIDIA container toolkit:
  #
  #   docker compose --profile pipeline-gpu run --rm pipeline-gpu \
  #       python -c "import torch; print(torch.cuda.is_available())"
  pipeline-gpu:
    profiles: ["pipeline-gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    networks:
      - omero
    volumes:
      - "./.env:/app/.env:ro"
      # Cellpose models. MODEL_DICT names custom lab models that do not exist
      # on cellpose.org, so a run without these fails at model download. The
      # image sets CELLPOSE_LOCAL_MODELS_PATH=/models. A bind mount copies
      # nothing, so pointing at the whole directory is free.
      - "${CELLPOSE_MODELS:-$HOME/.cellpose/models}:/models:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["omero-screen", "--help"]

networks:
  omero:

volumes:
  database:
  omero:
