[project]
name = "omero-screen"
version = "0.7.1"
description = "High-content image analysis pipeline for data stored in OMERO"
readme = "README.md"
authors = [{ name = "hh65", email = "hh65@sussex.ac.uk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "omero-utils",
    "python-dotenv>=1.0.1",
    # macOS-specific zeroc-ice wheel
    'zeroc-ice @ https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/download/20240131/zeroc_ice-3.6.5-cp312-cp312-macosx_11_0_universal2.whl ; sys_platform == "darwin"',
    # Linux aarch64-specific zeroc-ice wheel
    'zeroc-ice @ https://github.com/glencoesoftware/zeroc-ice-py-linux-aarch64/releases/download/20240620/zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_aarch64.whl ; sys_platform == "linux" and platform_machine == "aarch64"',
    # Linux x86_64-specific zeroc-ice wheel
    'zeroc-ice @ https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20240202/zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl ; sys_platform == "linux" and platform_machine == "x86_64"',
    # Windows-specific zeroc-ice wheel
    'zeroc-ice @ https://github.com/glencoesoftware/zeroc-ice-py-win-x86_64/releases/download/20240325/zeroc_ice-3.6.5-cp312-cp312-win_amd64.whl ; platform_system == "Windows"',
    # Default zeroc-ice for other platforms or architectures
    'zeroc-ice>=3.6.5; sys_platform != "darwin" and platform_machine != "aarch64" and platform_machine != "x86_64"',
    "omero-py>=5.19.5",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "rich>=13.9.4",
    "tifffile>=2025.3.30",
    "scipy>=1.15.2",
    "scikit-image>=0.25.2",
    "cellpose>=4.0",
    "ezomero>=3.1.1",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.1",
    "numpy>=1.26.4",
    "torch==2.9.1",
    "seaborn>=0.13.2",
    "duckdb>=1.2.2",
    "cellview",
    "jupyter>=1.1.1",
    "opencv-python>=4.11.0.86",
    "ipykernel>=6.29.5",
    "omero-screen-plots",
    "polars>=1.31.0",
    "pyarrow>=22.0.0",
    "diskcache>=5.6.3",
    "omero-cli-transfer>=1.3.1",
    "sphinx-autodoc-typehints>=2.3.0",
    "myst-parser>=4.0.1",
    "sphinxcontrib-video>=0.4.2",
    "sphinx-rtd-theme>=3.0.2",
    "trackastra>=0.5.3",
    "loguru>=0.7.3",
    "marimo>=0.23.15",
]

[project.optional-dependencies]
# The napari GUI. Kept out of the base dependencies so omero-screen installs
# headless: napari[all] pulls pyqt5, pyqt5-qt5 and triangle, none of which ship
# linux/arm64 wheels. src/omero_screen never imports napari — only the
# bin/phase_montage.py utility does — so the core pipeline is unaffected.
gui = ["omero-screen-napari[qt]"]

# Torch build selection. PyPI's default linux/x86_64 torch wheel drags in 15
# nvidia-* packages plus triton, which a CPU container does not want and cannot
# use. These two extras are mutually exclusive: sync `cpu` in the container,
# `cu128` on the RTX5090 box and Artemis. Syncing neither leaves torch on the
# default PyPI wheel.
# Pinned exactly, not ranged: the resolver forks these extras create otherwise
# let each fork drift to a different torch, and a bare `uv sync` on macOS was
# silently jumping 2.9.1 -> 2.14.0. Segmentation and tracking numerics depend on
# this version, so it moves deliberately or not at all. cu128, not cu126 — the
# cu126 index has no 2.9.1 (it starts at 2.10.0).
cpu = ["torch==2.9.1", "torchvision==0.24.1"]
cu128 = ["torch==2.9.1", "torchvision==0.24.1"]

[project.scripts]
omero-screen = "bin.run_omero_screen:main"
omero-screen-export = "bin.run_export:main"
omero-integration-test = "tests.e2e_tests.e2e_run:main"
cellview = "cellview.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/omero_screen", "tests"]

[tool.uv.workspace]
members = [
    ".",
    "packages/omero-utils",
    "packages/omero-screen-napari",
    "packages/omero-screen-plots",
    "packages/cellview",
    "packages/cellclass",
]

[tool.uv]
# `gui` is a default group so a bare `uv sync` still gives a developer napari,
# exactly as before. The container opts out with `uv sync --no-default-groups`.
default-groups = ["dev", "gui"]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
omero-screen = { workspace = true }
omero-utils = { workspace = true }
omero-screen-napari = { workspace = true }
omero-screen-plots = { workspace = true }
cellview = { workspace = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]


[dependency-groups]
gui = ["omero-screen-napari[qt]"]

dev = [
    "commitizen>=4.1.0",
    "mypy>=1.15.0",
    "pandas-stubs",
    "typing-extensions>=4.9.0",
    "pre-commit>=4.0.1",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "ruff==0.9.6",
    "nbstripout",
    "jupytext",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-argparse>=0.5.2",
]

docs = [ # installed only when we build docs
  "sphinx~=7.2",
  "myst-parser",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "sphinxcontrib-napoleon",
  "sphinx-argparse",
  "sphinxcontrib-video",
]

# ===========================
# Mypy Configuration Section
# ===========================

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
allow_untyped_decorators = true
mypy_path = "src:packages/omero-utils/src:packages/omero-screen-napari/src:packages/omero-screen-plots/src:packages/cellview/src:packages/cellclass/src"
exclude = [
    "tests/.*",
    ".venv/.*",
    "venv/.*",
    "env/.*",
    "build/.*",
    "dist/.*",
    "migrations/.*",
    ".*/(examples|docs|notebooks)/.*",    # Multiple dirs in one pattern
    ".*_nb\\.py$",                        # Jupytext files with _nb suffix
    ".*\\.ipynb$",
    "omero_screen_napari_original/.*",
    "examples/.*",
    ".*/test_stats\\.py$",
    "skills/.*",                          # runtime-agnostic skill asset scripts
]
incremental = true
cache_dir = ".mypy_cache"
ignore_missing_imports = true
pretty = true
warn_unused_configs = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
# Ignore everything ported from Cellpose v3
module = "omero_screen.cellpose3.*"
ignore_errors = true


# ===========================
# Ruff Configuration Section
# ===========================

[tool.ruff]
line-length = 79
lint.select = [
    "D", "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501",   # line too long. let black handle this
    "UP006",
    "UP007",  # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
    "ISC001", # string concatenation conflicts with formatter
    "G004", # logging statement uses f-string
    "D203",  # conflicting with D211 (Google prefers D211)
    "D213",  # conflicting with D212 (Google prefers D212)
    "BLE001", # Do not catch blind exception
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
    "**/*.ipynb",
    "tests/",
    "*/tests/",
    "*_test.py",
    "test_*.py"
]

extend-exclude = [
    "**/examples/**",          # Everything in any examples dir
    "**/docs/**",              # Everything in any docs dir
    "**/notebooks/**",         # Everything in any notebooks dir
    "**/cellpose3/**",         # Everything ported from Cellpose v3
    "skills/**",               # Runtime-agnostic skill asset scripts
]

fix = true

[tool.ruff.lint.pydocstyle]
convention = "google"


# ============================
# Pytest Configuration Section
# ============================

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --ignore=e2e/"
testpaths = ["tests"]
python_files = ["test_*.py"]


# ===========================
# Commitizen Configuration Section
# ===========================


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.1"
tag_format = "omero-screen-v$version"
version_files = [
    "src/omero_screen/__init__.py:__version__",
    "pyproject.toml:version",
    "packages/cellview/pyproject.toml:version",
    "packages/cellview/src/cellview/__init__.py:__version__",
    "packages/cellview/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "packages/omero-screen-napari/pyproject.toml:version",
    "packages/omero-screen-napari/src/omero_screen_napari/__init__.py:__version__",
    "packages/omero-screen-napari/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "packages/omero-screen-plots/pyproject.toml:version",
    "packages/omero-screen-plots/src/omero_screen_plots/__init__.py:__version__",
    "packages/omero-screen-plots/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "packages/omero-utils/pyproject.toml:version",
    "packages/omero-utils/src/omero_utils/__init__.py:__version__",
    "packages/omero-utils/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "packages/cellclass/pyproject.toml:version",
    "packages/cellclass/src/cellclass/__init__.py:__version__",
    "packages/cellclass/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
]
version_provider = "commitizen"
major_version_zero = true
bump_message = "bump: version $current_version → $new_version"
update_changelog_on_bump = true
# uv.lock pins the workspace members by version, so it has to be regenerated
# with the new version before the bump is committed. cz runs pre_bump_hooks
# after rewriting the version files and commits with `git commit -a`, so the
# refreshed lockfile is swept into the bump commit itself.
pre_bump_hooks = ["uv lock"]
annotated_tag = true
