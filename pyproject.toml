[project]
name = "omero-screen"
version = "0.8.23"
description = "High-content image analysis pipeline for data stored in OMERO"
readme = "README.md"
authors = [{ name = "hh65", email = "hh65@sussex.ac.uk" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "omero-utils",
    "python-dotenv>=1.0.1",
    # Ice 3.6.5 wheels for CPython 3.12-3.14 come from the hocheggerlab-ice
    # index (see [tool.uv.sources]); PyPI only has an unbuildable sdist.
    "zeroc-ice==3.6.5",
    "omero-py>=5.19.5",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "rich>=13.9.4",
    "tifffile>=2025.3.30",
    "scipy>=1.15.2",
    "scikit-image>=0.25.2",
    "cellpose>=4.2",
    "ezomero>=3.1.1",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.1",
    "numpy>=1.26.4",
    "torch>=2.7.0",
    "seaborn>=0.13.2",
    "duckdb>=1.2.2",
    "cellview",
    "jupyter>=1.1.1",
    "opencv-python>=4.11.0.86",
    "ipykernel>=6.29.5",
    "omero-screen-plots",
    "polars>=1.31.0",
    "pyarrow>=22.0.0",
    "diskcache>=5.6.3",
    "omero-cli-transfer>=1.3.1",
    # Frozen until the omero-screen paper is published, so its tracking
    # results stay reproducible (#27). 0.5.4-0.5.6 have no model changes.
    "trackastra==0.5.3",
    "loguru>=0.7.3",
    "marimo>=0.23.15",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
# The napari GUI. Kept out of the base dependencies so omero-screen installs
# headless: the PyQt6/Qt6 Linux wheels need glibc >= 2.34 (x86_64) or >= 2.39
# (aarch64), newer than some clusters. src/omero_screen never imports napari — only the
# bin/phase_montage.py utility does — so the core pipeline is unaffected.
gui = ["omero-screen-napari[qt]"]

[project.scripts]
omero-screen = "bin.run_omero_screen:main"
omero-screen-export = "bin.run_export:main"
omero-integration-test = "tests.e2e_tests.e2e_run:main"
cellview = "cellview.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/omero_screen", "tests"]

[tool.uv.workspace]
members = [
    ".",
    "packages/omero-utils",
    "packages/omero-screen-napari",
    "packages/omero-screen-plots",
    "packages/cellview",
    "packages/cellclass",
]

[tool.uv]
# `gui` is a default group so a bare `uv sync` still gives a developer napari,
# exactly as before. The container opts out with `uv sync --no-default-groups`.
default-groups = ["dev", "gui"]
# geff (via trackastra) declares `numcodecs<0.16; python_version >
# "3.10,<=3.11"`. The marker is malformed, so it falls back to a string
# comparison that is true on every Python >= 3.12, capping numcodecs at
# 0.15.1, which has no cp314 wheel. The cap is meant for 3.11 only; replace
# numcodecs' requirements with zarr 3's floor. Drop once geff fixes the marker.
override-dependencies = ["numcodecs>=0.15"]

[tool.uv.sources]
omero-screen = { workspace = true }
omero-utils = { workspace = true }
omero-screen-napari = { workspace = true }
omero-screen-plots = { workspace = true }
cellview = { workspace = true }
zeroc-ice = { index = "hocheggerlab-ice" }

# Pre-built zeroc-ice 3.6.5 wheels (cp312-cp314; linux x86_64/aarch64, macOS
# universal2, Windows x86_64), built from Glencoe's patch series because
# Glencoe's own releases stop at cp312. explicit: only zeroc-ice is resolved
# here. https://github.com/HocheggerLab/ice-wheels
[[tool.uv.index]]
name = "hocheggerlab-ice"
url = "https://hocheggerlab.github.io/ice-wheels/"
format = "flat"
explicit = true


[dependency-groups]
gui = ["omero-screen-napari[qt]"]

dev = [
    "commitizen>=4.1.0",
    "pandas-stubs",
    "typing-extensions>=4.9.0",
    "pre-commit>=4.0.1",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "ruff==0.9.6",
    "nbstripout",
    "jupytext",
    "fastmcp>=2.12",
    "ty==0.0.85",
]

# ===========================
# ty Configuration Section
# ===========================
# ty (Astral) type-checks the whole workspace in the project venv, in
# pre-commit and CI. It is beta: pinned exactly in both, bumped deliberately.

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
# Third-party typing gaps, handled here instead of with per-line ignores:
# - Ice, omero.api / .model / .rtypes / .sys: Ice generates its
#   exceptions and the model classes (PlateI, LengthI, ...) at import time,
#   so ty cannot see them statically;
# - ezomero: its untyped decorators make every wrapped function `object`.
replace-imports-with-any = ["Ice", "omero.api", "omero.api.**", "omero.model", "omero.model.**", "omero.rtypes", "omero.sys", "ezomero", "ezomero.**"]

[tool.ty.src]
exclude = [
    "tests/",                                 # not type-checked, by choice
    "src/omero_screen/cellpose3/",            # ported from Cellpose v3
    "skills/",                                # runtime-agnostic skill asset scripts
    "plugins/*/skills/",
    "**/examples/",
    "**/docs/",
    "**/notebooks/",
    "omero_screen_napari_original/",
]

# cellview explore templates are fill-in notebooks: the user defines
# `conditions` (and the condition column) before running, so the name is
# unbound by design. Keep every other check on.
[[tool.ty.overrides]]
include = ["packages/cellview/src/cellview/explore/templates/**"]

[tool.ty.overrides.rules]
unresolved-reference = "ignore"


# ===========================
# Ruff Configuration Section
# ===========================

[tool.ruff]
line-length = 79
target-version = "py312"
lint.select = [
    "D", "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501",   # line too long. let black handle this
    "UP006",
    "UP007",  # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
    "ISC001", # string concatenation conflicts with formatter
    "G004", # logging statement uses f-string
    "D203",  # conflicting with D211 (Google prefers D211)
    "D213",  # conflicting with D212 (Google prefers D212)
    "BLE001", # Do not catch blind exception
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
    "**/*.ipynb",
    "tests/",
    "*/tests/",
    "*_test.py",
    "test_*.py"
]

extend-exclude = [
    "**/examples/**",          # Everything in any examples dir
    "**/docs/**",              # Everything in any docs dir
    "**/notebooks/**",         # Everything in any notebooks dir
    "**/cellpose3/**",         # Everything ported from Cellpose v3
    "skills/**",               # Runtime-agnostic skill asset scripts
    "plugins/*/skills/**",
]

fix = true

[tool.ruff.lint.pydocstyle]
convention = "google"


# ============================
# Pytest Configuration Section
# ============================

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --ignore=e2e/"
testpaths = ["tests"]
python_files = ["test_*.py"]


# ===========================
# Commitizen Configuration Section
# ===========================


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.23"
tag_format = "omero-screen-v$version"
version_files = [
    "src/omero_screen/__init__.py:__version__",
    "plugins/omero-screen/.claude-plugin/plugin.json:\"version\"",
    "pyproject.toml:version",
    "packages/cellview/pyproject.toml:version",
    "packages/cellview/src/cellview/__init__.py:__version__",
    "packages/cellview/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "packages/omero-screen-napari/pyproject.toml:version",
    "packages/omero-screen-napari/src/omero_screen_napari/__init__.py:__version__",
    "packages/omero-screen-napari/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "packages/omero-screen-plots/pyproject.toml:version",
    "packages/omero-screen-plots/src/omero_screen_plots/__init__.py:__version__",
    "packages/omero-screen-plots/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "packages/omero-utils/pyproject.toml:version",
    "packages/omero-utils/src/omero_utils/__init__.py:__version__",
    "packages/omero-utils/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "packages/cellclass/pyproject.toml:version",
    "packages/cellclass/src/cellclass/__init__.py:__version__",
    "packages/cellclass/README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
    "README.md:version-[0-9]+\\.[0-9]+\\.[0-9]+",
]
version_provider = "commitizen"
major_version_zero = true
# [skip ci]: the bump is pushed with a deploy key, and unlike GITHUB_TOKEN
# pushes those trigger workflows. The bump commit only changes version
# strings, so re-running CI, docs and a no-op Release on it is wasted.
bump_message = "bump: version $current_version → $new_version [skip ci]"
update_changelog_on_bump = true
# uv.lock pins the workspace members by version, so it has to be regenerated
# with the new version before the bump is committed. cz runs pre_bump_hooks
# after rewriting the version files and commits with `git commit -a`, so the
# refreshed lockfile is swept into the bump commit itself.
pre_bump_hooks = ["uv lock"]
annotated_tag = true
