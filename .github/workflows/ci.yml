name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Permissions can be more restricted if using PAT
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of requires-python; 3.13 joins in the Phase 3
        # full matrix.
        python-version: ["3.12", "3.14"]
    env:
      # Without this, uv sync/run use .python-version (3.12) and silently
      # ignore the matrix.
      UV_PYTHON: ${{ matrix.python-version }}
      # Headless Qt for the napari widget tests.
      QT_QPA_PLATFORM: offscreen

    services:
      database:
        image: "postgres:14"
        env:
          POSTGRES_USER: omero
          POSTGRES_DB: omero
          POSTGRES_PASSWORD: omero
        volumes:
          - "database:/var/lib/postgresql/data"
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      omeroserver:
        image: "openmicroscopy/omero-server:5"
        env:
          CONFIG_omero_db_host: database
          CONFIG_omero_db_user: omero
          CONFIG_omero_db_pass: omero
          CONFIG_omero_db_name: omero
          ROOTPASS: omero
        ports:
          - "4063:4063"
          - "4064:4064"
        volumes:
          - "omero:/OMERO"
        # Health check runs in the docker container; an omero login command requires omero CLI to be installed.
        # This is not available in the docker image so we cannot perform a health check.
        # options: >-
        #     --health-cmd "omero login root@localhost:4064 --password omero"
        #     --health-interval 10s
        #     --health-timeout 5s
        #     --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Qt 6 system libraries
        # PyQt6's Qt 6 links against the system EGL/xkbcommon/fontconfig
        # libraries, which the minimal runner image lacks (PyQt5 did not need
        # them): without these every napari test fails to import with
        # "libEGL.so.1: cannot open shared object file".
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        # Plain sync: the default groups (dev, gui) cover the test suite,
        # napari included. There are no torch extras to name — torch comes
        # from PyPI as it always did.
        run: |
          uv sync --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format with Ruff
        run: uv run ruff format --check .

      - name: Type check with ty
        # The whole workspace (all six packages), in the project venv; ty is
        # pinned in the dev group and configured in pyproject.toml [tool.ty].
        run: uv run ty check

      - name: Set-up env
        run: |
          echo "ENV=development" >> $GITHUB_ENV
          echo "USERNAME=root" >> $GITHUB_ENV
          echo "PASSWORD=omero" >> $GITHUB_ENV
          echo "HOST=localhost" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
          echo "LOG_FILE_PATH=logs/app.log" >> $GITHUB_ENV
          echo "LOG_FORMAT=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s" >> $GITHUB_ENV
          echo "ENABLE_CONSOLE_LOGGING=True" >> $GITHUB_ENV
          echo "ENABLE_FILE_LOGGING=False" >> $GITHUB_ENV
          echo "TEST_IMAGE_SIZE=540" >> $GITHUB_ENV

      - name: Run tests
        run: |
          uv run pytest tests/ -v --ignore=tests/e2e_tests/
