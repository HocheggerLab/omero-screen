name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install commitizen
        run: pip install commitizen

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Bump version
        run: cz bump --yes || echo "No version bump needed"

      # cz bump writes the new version into pyproject.toml and the package
      # __init__ files, but knows nothing about uv.lock, which pins the
      # workspace members by version. `uv lock` runs as a commitizen
      # pre_bump_hook (see [tool.commitizen] in pyproject.toml): the hook fires
      # after the version files are rewritten and before `cz bump` commits with
      # `git commit -a`, so the refreshed lockfile lands inside the bump commit
      # and cz's own annotated tag is created on top of it. Nothing here needs
      # to amend the commit or move the tag.
      #
      # Do not reintroduce a `git tag -f` step: it replaces cz's annotated tag
      # with a lightweight one, `git push --follow-tags` then silently skips it,
      # and with no tag on the remote cz falls back to scanning the entire
      # history for an increment and bumps on every single CI run.
      - name: Push changes
        run: git push --follow-tags
