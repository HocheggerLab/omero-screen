name: Documentation (Sphinx, legacy)

# SUPERSEDED by docs-greatdocs.yml, which owns the GitHub Pages deployment.
# This workflow still builds so the remaining docs/ tree cannot rot unnoticed,
# but its deploy job is disabled: two workflows publishing to the same Pages
# environment race, and the loser silently overwrites the winner.
# Delete this file, and docs/, once the Sphinx content has been retired.

on:
  # Manual trigger
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "packages/**/docs/**"
      - "packages/**/src/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "packages/**/docs/**"
      - "packages/**/src/**"
      - "pyproject.toml"
  # Also run after successful releases
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches: [main]

# Allow one concurrent deployment
# Its own group, NOT "pages". This workflow can no longer deploy (see below),
# so it does not contend for the Pages environment — and sharing that group
# made the two doc workflows cancel each other's *builds*, since concurrency
# applies to the whole workflow rather than to the deploy job alone.
concurrency:
  group: "sphinx-legacy-${{ github.ref }}"
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          # Install the project and docs dependencies
          uv sync --group docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build documentation
        run: |
          # Build the documentation from the root
          uv run --group docs sphinx-build -b html docs docs/_build/html
        env:
          # Enable plot generation in CI to ensure docs are up-to-date
          BUILD_PLOTS: true
          # Use headless display for matplotlib in CI
          MPLBACKEND: Agg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Deploy job
  deploy:
    # Deploy on pushes to main or after successful releases
    # Disabled: docs-greatdocs.yml owns the Pages deployment.
    if: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
